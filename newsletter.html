  <style>
    :root {
      --orange: #F49F25;
      --gray: #707173;
      --dark: #1e1e1e;
      --border: #e4e4e4;
      --bg: #f2f2f2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); height: 100vh; overflow: hidden; }

    /* ─── Header ─── */
    .header {
      height: 52px; background: var(--dark);
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px; position: relative; z-index: 10;
    }
    .header img { height: 28px; }
    .header h1 { font-size: 13px; font-weight: 600; color: #fff; letter-spacing: .4px; }
    .header .spacer { flex: 1; }
    .header .badge { font-size: 10px; background: var(--orange); color: white; padding: 3px 8px; border-radius: 3px; font-weight: 700; letter-spacing: .5px; }

    /* ─── Layout ─── */
    .layout { display: grid; grid-template-columns: 320px 1fr; height: calc(100vh - 52px); }

    /* ─── Left Panel ─── */
    .sidebar { background: #fff; border-right: 1px solid var(--border); overflow-y: auto; display: flex; flex-direction: column; }
    .sidebar-inner { padding: 16px; flex: 1; }

    .section { margin-bottom: 20px; }
    .section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--gray); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 12px;
    }

    /* Accordion */
    .accordion { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .accordion-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; cursor: pointer; background: #fafafa;
      font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
      color: var(--gray); user-select: none; transition: background .15s;
    }
    .accordion-header:hover { background: #f0f0f0; }
    .accordion-arrow { font-size: 9px; transition: transform .2s; display: inline-block; }
    .accordion.open .accordion-arrow { transform: rotate(180deg); }
    .accordion-body { display: none; padding: 10px 12px 12px; }
    .accordion.open .accordion-body { display: block; }
    label { display: block; font-size: 11px; color: var(--gray); font-weight: 600; margin-bottom: 3px; margin-top: 8px; }
    label:first-of-type { margin-top: 0; }
    input[type=text], input[type=password], textarea, select {
      width: 100%; padding: 7px 9px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 12px; color: var(--dark);
      font-family: inherit; transition: border-color .15s;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--orange); }
    textarea { resize: vertical; min-height: 56px; line-height: 1.5; }
    small { font-size: 10px; color: #aaa; display: block; margin-top: 2px; }

    /* Objekt Rows */
    .obj-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .obj-row input { flex: 1; margin: 0; }
    .obj-badge {
      font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 2px 6px;
      border-radius: 3px; white-space: nowrap; flex-shrink: 0;
    }
    .badge-hero { background: var(--orange); color: #fff; }
    .badge-n { background: #eee; color: var(--gray); }

    /* Buttons */
    .btn {
      width: 100%; padding: 9px 12px; border: none; border-radius: 4px;
      font-size: 12px; font-weight: 700; cursor: pointer; transition: opacity .15s;
      display: block; text-align: center;
    }
    .btn + .btn { margin-top: 6px; }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { background: var(--orange); color: #fff; }
    .btn-dark { background: var(--dark); color: #fff; }
    .btn-ghost { background: #fff; color: var(--dark); border: 1px solid var(--border); }

    /* Status */
    .status { margin-top: 10px; padding: 7px 10px; border-radius: 4px; font-size: 11px; display: none; }
    .status.visible { display: block; }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.err { background: #ffebee; color: #c62828; }
    .status.loading { background: #fff8e1; color: #e65100; }

    /* ─── Right Panel ─── */
    .preview-panel { display: flex; flex-direction: column; }
    .preview-bar {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    }
    .preview-bar span { font-size: 11px; color: var(--gray); flex: 1; }
    .preview-bar .act-btn {
      padding: 5px 14px; border-radius: 4px; font-size: 11px; font-weight: 700;
      cursor: pointer; border: none; transition: opacity .15s;
    }
    .preview-bar .act-btn:hover { opacity: .85; }
    .btn-copy-bar { background: var(--orange); color: #fff; }
    .btn-dl-bar { background: var(--dark); color: #fff; }

    .preview-scroll { flex: 1; overflow: hidden; background: #e0e0e0; display: flex; flex-direction: column; }
    #preview-iframe { flex: 1; border: none; width: 100%; background: #e0e0e0; }

    .empty-state { text-align: center; padding: 80px 20px; color: var(--gray); }
    .empty-state h3 { font-size: 15px; margin-bottom: 8px; color: var(--dark); }
    .empty-state p { font-size: 12px; line-height: 1.6; }
    .empty-icon { font-size: 40px; margin-bottom: 16px; }
  </style>

// ══════════════════════════════════════════════════════════
// onOffice API
// ══════════════════════════════════════════════════════════

async function onOfficeRequest(actions) {
  let res;
  try {
    res = await fetch('/api/onoffice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ actions })
    });
  } catch (networkErr) {
    throw new Error('Server nicht erreichbar. Details: ' + networkErr.message);
  }

  if (!res.ok) throw new Error('HTTP ' + res.status + ' – ' + res.statusText);

  const json = await res.json();

  // onOffice gibt manchmal Fehler im Body zurück
  if (json.status && json.status.errorcode !== 0) {
    throw new Error('onOffice Fehler ' + json.status.errorcode + ': ' + json.status.message);
  }

  return json;
}

const ESTATE_DATA_FIELDS = [
  'Id','objektnr_extern','objektnr_intern','objektart','objekttyp','vermarktungsart',
  'plz','ort','strasse','kaufpreis','kaltmiete','wohnflaeche',
  'grundstuecksflaeche','anzahl_zimmer','baujahr','objekttitel','lage'
];

// Suche per objektnr_extern (externe Nummer) mit Wildcard
function estateAction(nr, id) {
  return {
    actionid: 'urn:onoffice-de-ns:smart:2.5:smartml:action:read',
    identifier: id, type: 'estate',
    resourceid: '', resourcetype: 'estate', cacheable: false,
    parameters: {
      data: ESTATE_DATA_FIELDS,
      filter: { objektnr_extern: [{ op: 'like', val: '%' + nr + '%' }] },
      listlimit: 5
    }
  };
}

// Fallback: Suche per objektnr_intern (interne Nummer) mit Wildcard
function estateActionByIntern(nr, id) {
  return {
    actionid: 'urn:onoffice-de-ns:smart:2.5:smartml:action:read',
    identifier: id, type: 'estate',
    resourceid: '', resourcetype: 'estate', cacheable: false,
    parameters: {
      data: ESTATE_DATA_FIELDS,
      filter: { objektnr_intern: [{ op: 'like', val: '%' + nr + '%' }] },
      listlimit: 5
    }
  };
}

function photoAction(estateId, id) {
  return {
    actionid: 'urn:onoffice-de-ns:smart:2.5:smartml:action:get',
    identifier: id, type: '',
    resourceid: '', resourcetype: 'estatepictures', cacheable: false,
    parameters: {
      estateids: [estateId],
      categories: ['Titelbild', 'Foto'],
      language: 'DEU'
    }
  };
}

function slugify(str) {
  return (str || '')
    .toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// Mapping: onOffice-Typ → URL-Slug auf der Website
const TYPE_SLUG = {
  // Wohnungen (onOffice liefert oft nur den Typ ohne "-wohnung"-Suffix)
  'erdgeschoss':          'erdgeschosswohnung',
  'erdgeschosswohnung':   'erdgeschosswohnung',
  'etagenwohnung':        'etagenwohnung',
  'etage':                'etagenwohnung',
  'penthouse':            'penthouse-wohnung',
  'penthouse-wohnung':    'penthouse-wohnung',
  'penthousewohnung':     'penthouse-wohnung',
  'dachgeschoss':         'dachgeschosswohnung',
  'dachgeschosswohnung':  'dachgeschosswohnung',
  'maisonette':           'maisonette',
  'terrassenwohnung':     'terrassenwohnung',
  'apartment':            'apartment',
  // Häuser
  'einfamilienhaus':      'einfamilienhaus',
  'doppelhaushaelfte':    'doppelhaushaelfte',
  'doppelhaushälfte':     'doppelhaushaelfte',
  'reihenhaus':           'reihenhaus',
  'reiheneckhaus':        'reiheneckhaus',
  'reihenmittelhaus':     'reihenmittelhaus',
  'bungalow':             'bungalow',
  'villa':                'villa',
  'mehrfamilienhaus':     'mehrfamilienhaus',
  'zweifamilienhaus':     'zweifamilienhaus',
};

function estateUrl(e) {
  if (e.url) return e.url;  // manuell überschrieben
  const rawType   = slugify(e.type || e.art);
  const type      = TYPE_SLUG[rawType] || rawType;
  const city      = slugify(e.city);
  const marketing = (e.priceLabel === 'Kaufpreis') ? 'kauf' : 'miete';
  const nr        = slugify(e.nr);
  return `https://orange-immobilien.de/immobilien/${type}-in-${city}-${marketing}-${nr}`;
}

function parseEstate(result) {
  if (!result || result.status?.errorcode !== 0) return null;
  const rec = result.data?.records?.[0];
  if (!rec) return null;
  const e = rec.elements || {};
  return {
    id: rec.id,
    nr: e.objektnr_extern || '',
    title: e.objekttitel || '',
    type: e.objekttyp || e.objektart || '',
    art: e.objektart || '',
    city: e.ort || '',
    plz: e.plz || '',
    location: e.lage || (e.plz ? e.plz + ' ' + e.ort : e.ort) || '',
    price: parseFloat(e.kaufpreis || e.kaltmiete || 0),
    priceLabel: e.kaufpreis ? 'Kaufpreis' : 'Kaltmiete',
    area: parseFloat(e.wohnflaeche || 0),
    plot: parseFloat(e.grundstuecksflaeche || 0),
    rooms: parseFloat(e.anzahl_zimmer || 0),
    year: e.baujahr || '',
    image: ''
  };
}

let currentEstates = [];
let generatedHTML = '';

async function loadFromAPI() {
  const nrs = [0,1,2,3,4].map(i => document.getElementById('obj-'+i).value.trim()).filter(Boolean);
  if (!nrs.length) { setStatus('Bitte mindestens eine Objektnummer eingeben.', 'err'); return; }

  document.getElementById('btn-load').disabled = true;
  setStatus('Lade Objekte …', 'loading');

  try {
    // 1. Suche per objektnr_extern
    setStatus('Suche Objekte (extern) …', 'loading');
    const actions = nrs.map((nr, i) => estateAction(nr, 'e'+i));
    const result = await onOfficeRequest(actions);
    const results = result.response?.results || [];

    // Rohdaten in Konsole für Debugging
    console.log('[onOffice] Rohantwort extern:', JSON.stringify(result, null, 2));

    const byId = {};
    results.forEach(r => { byId[r.identifier] = r; });

    // Finde nicht-gefundene Objekte
    const estates = [];
    const missingNrs = [];
    for (let i = 0; i < nrs.length; i++) {
      const e = parseEstate(byId['e'+i]);
      if (e) { estates.push({ idx: i, estate: e }); }
      else { missingNrs.push({ idx: i, nr: nrs[i] }); }
    }

    // 2. Fallback: Suche per objektnr_intern für nicht gefundene
    if (missingNrs.length > 0) {
      setStatus('Suche ' + missingNrs.length + ' Objekte (intern) …', 'loading');
      const fallbackActions = missingNrs.map(m => estateActionByIntern(m.nr, 'f'+m.idx));
      const fallbackResult = await onOfficeRequest(fallbackActions);
      console.log('[onOffice] Rohantwort intern:', JSON.stringify(fallbackResult, null, 2));

      const fbById = {};
      (fallbackResult.response?.results || []).forEach(r => { fbById[r.identifier] = r; });

      for (const m of missingNrs) {
        const e = parseEstate(fbById['f'+m.idx]);
        if (e) { estates.push({ idx: m.idx, estate: e }); }
        else {
          // Zeige was die API zurückgegeben hat
          const raw = fbById['f'+m.idx];
          const count = raw?.data?.meta?.cntabsolute ?? 'unbekannt';
          const errcode = raw?.status?.errorcode ?? '?';
          const errmsg = raw?.status?.message ?? '';
          let debugInfo = 'Treffer: ' + count + ' | API-Code: ' + errcode;
          if (errmsg && errmsg !== 'OK') debugInfo += ' | ' + errmsg;
          setStatus(
            '⚠ Objekt "' + m.nr + '" nicht gefunden.\n' +
            debugInfo + '\n\n' +
            'Tipp: Öffne Browser-Konsole (F12 → Console) für die vollständige API-Antwort.\n' +
            'Prüfe auch ob die Objektnummer exakt so in onOffice steht (Objekt → Verwaltung).',
            'err'
          );
          document.getElementById('btn-load').disabled = false;
          return;
        }
      }
    }

    // Sortiere nach ursprünglicher Reihenfolge
    estates.sort((a, b) => a.idx - b.idx);
    const sortedEstates = estates.map(e => e.estate);

    // 3. Bilder laden
    setStatus('Lade Bilder …', 'loading');
    try {
      const pActions = sortedEstates.map((e, i) => photoAction(e.id, 'p'+i));
      const pResult = await onOfficeRequest(pActions);
      const pByid = {};
      (pResult.response?.results || []).forEach(r => { pByid[r.identifier] = r; });

      sortedEstates.forEach((e, i) => {
        const pr = pByid['p'+i];
        // elements ist ein Objekt mit Einträgen { estateid, url, title, type, ... }
        const records = pr?.data?.records || [];
        let url = null;
        for (const rec of records) {
          const entries = Object.values(rec.elements || {});
          for (const entry of entries) {
            if (entry?.url) { url = entry.url; break; }
          }
          if (url) break;
        }
        console.log('[Foto] Objekt', e.id, '→', url || 'kein Bild');
        if (url) { e.image = url; document.getElementById('img-'+i).value = url; }
      });
    } catch(pe) { console.warn('Bilder-API:', pe); }

    currentEstates = sortedEstates;
    renderAndPreview(sortedEstates);
    setStatus('✓ ' + sortedEstates.length + ' Objekte geladen', 'ok');
    showImgSection();
    showTextSection(sortedEstates);
    showLinkSection(sortedEstates);

  } catch(err) {
    console.error('onOffice API Fehler:', err);
    setStatus('⚠ ' + err.message, 'err');
  }
  document.getElementById('btn-load').disabled = false;
}

function refreshPreview() {
  if (!currentEstates.length) return;
  // Apply manual image overrides
  currentEstates.forEach((e, i) => {
    const v = document.getElementById('img-'+i).value.trim();
    if (v) e.image = v;
  });
  renderAndPreview(currentEstates);
}

function toggleAccordion(id) {
  document.getElementById(id).classList.toggle('open');
}

function showAccordion(id) {
  const el = document.getElementById(id);
  el.style.display = '';
}

function showImgSection() {
  showAccordion('img-section');
}

function showTextSection(estates) {
  const labels = ['Hero-Titel', 'Objekt 1 – Titel', 'Objekt 2 – Titel', 'Objekt 3 – Titel', 'Objekt 4 – Titel'];
  estates.forEach((e, i) => {
    const input = document.getElementById('text-' + i);
    const label = document.getElementById('text-label-' + i);
    if (input) {
      input.value = e.title || '';
      if (label) label.textContent = i === 0 ? 'Hero – ' + (e.nr || 'Titel') : 'Objekt ' + i + ' – ' + (e.nr || 'Titel');
      input.style.display = '';
      label.style.display = '';
    }
  });
  // Felder für nicht vorhandene Objekte ausblenden
  for (let i = estates.length; i <= 4; i++) {
    const input = document.getElementById('text-' + i);
    const label = document.getElementById('text-label-' + i);
    if (input) input.style.display = 'none';
    if (label) label.style.display = 'none';
  }
  showAccordion('text-section');
}

function showLinkSection(estates) {
  estates.forEach((e, i) => {
    const input = document.getElementById('link-' + i);
    const label = document.getElementById('link-label-' + i);
    if (input) {
      input.value = e.url || estateUrl(e);
      if (label) label.textContent = i === 0 ? 'Hero – ' + (e.nr || 'Link') : 'Objekt ' + i + ' – ' + (e.nr || 'Link');
      input.style.display = '';
      label.style.display = '';
    }
  });
  for (let i = estates.length; i <= 4; i++) {
    const input = document.getElementById('link-' + i);
    const label = document.getElementById('link-label-' + i);
    if (input) input.style.display = 'none';
    if (label) label.style.display = 'none';
  }
  showAccordion('link-section');
}

function esc(val) {
  if (val === null || val === undefined) return '';
  return String(val)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function eur(val) {
  if (!val) return 'Preis auf Anfrage';
  return new Intl.NumberFormat('de-DE', { minimumFractionDigits:0, maximumFractionDigits:0 }).format(val);
}

function heroSpecCell(val, label, isOrange, isLast) {

  return `<td style="text-align:center;padding:18px 0;${border}">

// RENDER & EXPORT

function renderAndPreview(estates) {
  generatedHTML = generateHTML(estates);
  const iframe = document.getElementById('preview-iframe');
  iframe.removeAttribute('srcdoc');
  if (iframe._blobUrl) URL.revokeObjectURL(iframe._blobUrl);
  const blob = new Blob([generatedHTML], { type: 'text/html; charset=utf-8' });
  iframe._blobUrl = URL.createObjectURL(blob);
  iframe.src = iframe._blobUrl;
  const h = estates[0];
  document.getElementById('preview-label').textContent =
    estates.length + ' Objekte · ' + (h.type || '') + ' · ' + (h.location || h.city || '');
}

async function copyHTML() {
  if (!generatedHTML) { alert('Bitte erst Objekte laden.'); return; }
  try {
    await navigator.clipboard.writeText(generatedHTML);
  } catch {
    const ta = document.createElement('textarea');
    ta.value = generatedHTML; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }
  const btn = document.getElementById('btn-copy');
  btn.textContent = '✓ Kopiert!';
  btn.style.background = '#4caf50';
  setTimeout(() => { btn.textContent = '⎘ Kopieren'; btn.style.background = ''; }, 2000);
}

function downloadHTML() {
  if (!generatedHTML) { alert('Bitte erst Objekte laden.'); return; }
  const edition = (document.getElementById('nl-edition').value || 'newsletter').toLowerCase().replace(/\s+/g, '-');
  const blob = new Blob([generatedHTML], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'orange-newsletter-' + edition + '.html';
  a.click();
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg; el.className = 'status visible ' + type;
}


// Live-Update beim Bearbeiten der Titel
let textUpdateTimer = null;
[0,1,2,3,4].forEach(i => {
  const el = document.getElementById('text-' + i);
  if (!el) return;
  el.addEventListener('input', () => {
    if (!currentEstates || !currentEstates[i]) return;
    currentEstates[i].title = el.value;
    // Debounce: Vorschau erst nach 400ms aktualisieren (nicht bei jedem Tastendruck)
    clearTimeout(textUpdateTimer);
    textUpdateTimer = setTimeout(() => renderAndPreview(currentEstates), 400);
  });
});

// Live-Update beim Bearbeiten der Links
let linkUpdateTimer = null;
[0,1,2,3,4].forEach(i => {
  const el = document.getElementById('link-' + i);
  if (!el) return;
  el.addEventListener('input', () => {
    if (!currentEstates || !currentEstates[i]) return;
    currentEstates[i].url = el.value.trim() || null;
    clearTimeout(linkUpdateTimer);
    linkUpdateTimer = setTimeout(() => renderAndPreview(currentEstates), 400);
  });
});

window.addEventListener('load', () => {
  loadDemo();
});
